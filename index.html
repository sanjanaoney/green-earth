<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <!-- title and logo -->

    <link rel="shortcut icon" href="./assets/hero-leaf1.png" type="image/x-icon">

     <!-- syle.css link added -->
      <link rel="stylesheet" href="style.css">

         <!-- font awesome cdn -->

     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<div class="navbar bg-[#15803D] shadow-sm px-10 py-3 ">
  <div class="navbar-start ">
    <div class="dropdown">

        <svg aria-label="Menu" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"> <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h8m-8 6h16" /> </svg>
      </div>
      <ul
        tabindex="-1"
        class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow ">
        <li><a class="hover:text-[#FACC15] hover:bg-transparent text-[#15803D]">About</a></li>
        <li>
          <a class="hover:text-[#FACC15] hover:bg-transparent text-[#15803D]">Gallery</a>
          
        </li>
        <li><a class="hover:text-[#FACC15] hover:bg-transparent text-[#15803D]">Plant a Tree</a></li>
      </ul>
    </div>
    <h1 class=" text-2xl font-bold text-white">Green Earth</h1>
  </div>
  <div class="navbar-center hidden lg:flex text-white">
    <ul class="menu menu-horizontal px-1 text-lg">
      <li><a class="hover:text-[#FACC15] hover:bg-transparent ">About</a></li>
      <li>
       
          <a class="hover:text-[#FACC15] hover:bg-transparent ">Gallery</a>
          
       
      </li>
      <li><a class=" hover:text-[#FACC15] hover:bg-transparent">Plant a Tree</a></li>
    </ul>
  </div>
  <div class="navbar-end ">
    <button class="btn text-[#15803D] bg-[#FACC15] rounded-3xl hover:bg-[#F97316]  border-none shadow-none">Plant a Tree</button>
  </div>
</div>
</header>
<!-- navbar ends here -->



<!-- banner section starts here -->
<section class="flex bg-[#CFF0DC] justify-between">

    <div class="hidden md:flex w-1/3 items-end">
        <img class="" src="./assets/hero-leaf1.png" alt="">
    </div>
    <div class="text-center py-10 w-full md:w-1/2 flex flex-col justify-center">
        <h1 class="text-black text-3xl md:text-4xl font-bold px-6 py-4">
            Plant a Tree, Grow a Future
        </h1>

        <p class="text-black text-sm md:text-base">
            Join our mission to plant 1 million trees and make the Earth greener for future generations.
        </p>

        <div class="mt-4">
            <button class="btn text-[#15803D] bg-[#FACC15] rounded-3xl hover:bg-[#F97316] border-none shadow-none">
                Get Involved
            </button>
        </div>
    </div>

    <div class="hidden md:flex w-1/3 items-end">
        <img class="w-full" src="./assets/hero-leaf2.png" alt="">
    </div>
</section>
<!-- banner section ends here -->






<script src="./script/index.js"></script>
